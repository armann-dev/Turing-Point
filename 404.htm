<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found — Turing Point</title>

  <meta
    name="description"
    content="The page you're looking for could not be found. Return to Turing Point."
  >

  <style>
    /* =========================================================
       FONTS
       Miroge is used ONLY for the Turing Point brand text.
       ========================================================= */

    @font-face {
      font-family: "Miroge";
      src: url("assets/fonts/Miroge.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f8fbff;
      --text: #142033;
      --text-muted: #5b6d86;
      --accent: #1fc8f2;
      --accent-blue: #1863f2;
      --border: rgba(20, 32, 51, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(31, 200, 242, 0.10),
          transparent 32%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(24, 99, 242, 0.06),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      overflow-x: hidden;
    }

    /* =========================================================
       PAGE
       ========================================================= */

    .error-page {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      isolation: isolate;

      padding: 40px 20px;
    }

    /* Subtle background grid */

    .error-page::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(24, 99, 242, 0.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(24, 99, 242, 0.045) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 18%,
        black 82%,
        transparent
      );

      pointer-events: none;
      z-index: -2;
    }

    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    .error-content {
      width: min(720px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* =========================================================
       LOGO
       ========================================================= */

    .brand-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;

      margin: 0 auto 20px;

      filter:
        drop-shadow(0 8px 20px rgba(24, 99, 242, 0.18))
        drop-shadow(0 0 18px rgba(31, 200, 242, 0.10));

      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* =========================================================
       BRAND NAME
       Miroge ONLY here
       ========================================================= */

    .brand-name {
      font-family: "Miroge", sans-serif;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: normal;
      letter-spacing: 0.01em;
      margin: 0 0 34px;

      background: linear-gradient(
        90deg,
        #1863f2,
        #1fc8f2
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* =========================================================
       404 NUMBER
       ========================================================= */

    .error-code {
      margin: 0;

      font-size: clamp(7rem, 22vw, 12rem);
      line-height: 0.82;

      font-weight: 800;
      letter-spacing: -0.08em;

      background: linear-gradient(
        135deg,
        #0b2fa8 10%,
        #1863f2 48%,
        #1fc8f2 90%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 12px 40px rgba(24, 99, 242, 0.10);
    }

    /* =========================================================
       TEXT
       ========================================================= */

    .error-title {
      margin: 28px 0 12px;

      font-size: clamp(1.5rem, 4vw, 2.2rem);
      line-height: 1.2;

      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .error-description {
      max-width: 500px;
      margin: 0 auto;

      color: var(--text-muted);

      font-size: 1rem;
      line-height: 1.7;
    }

    /* =========================================================
       BUTTON
       ========================================================= */

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 30px;

      min-height: 50px;
      padding: 0 24px;

      border: 1px solid rgba(31, 200, 242, 0.45);
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #1863f2,
          #1b9df4
        );

      color: #ffffff;

      text-decoration: none;

      font-size: 0.95rem;
      font-weight: 650;

      box-shadow:
        0 10px 24px rgba(24, 99, 242, 0.16),
        0 0 22px rgba(31, 200, 242, 0.08);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;
    }

    .home-button:hover {
      transform: translateY(-5px);

      box-shadow:
        0 16px 32px rgba(24, 99, 242, 0.20),
        0 0 28px rgba(31, 200, 242, 0.18);

      filter: brightness(1.04);
    }

    .home-button:active {
      transform: translateY(-2px);
    }

    /* =========================================================
       SMALL FOOTER
       ========================================================= */

    .error-footer {
      margin-top: 48px;

      font-size: 0.78rem;
      color: #7a8aa0;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .error-page {
        padding: 32px 18px;
      }

      .brand-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }

      .brand-name {
        margin-bottom: 28px;
      }

      .error-code {
        font-size: clamp(6.5rem, 30vw, 9rem);
      }

      .error-title {
        margin-top: 24px;
      }

      .error-description {
        font-size: 0.94rem;
      }

      .home-button {
        width: 100%;
        max-width: 280px;
      }

      .error-footer {
        margin-top: 36px;
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      .brand-logo {
        animation: none;
      }

      .home-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="error-content">

      <!-- Turing Point Logo -->
      <img
        src="assets/images/tp-logo.png"
        alt="Turing Point"
        class="brand-logo"
      >

      <!-- Miroge ONLY on brand name -->
      <p class="brand-name">Turing Point</p>

      <!-- Error -->
      <h1 class="error-code">404</h1>

      <h2 class="error-title">
        Looks like you've reached a dead end.
      </h2>

      <p class="error-description">
        The page you're looking for doesn't exist or may have been moved.
        Let's get you back to somewhere useful.
      </p>

      <a href="index.html" class="home-button">
        Back to Home →
      </a>

      <p class="error-footer">
        © 2026 Turing Point. All rights reserved.
      </p>

    </div>

  </main>

</body>
</html>
